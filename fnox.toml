[providers.op]
type = "1password"
vault = "Dev"

[secrets]
GITHUB_CLIENT_ID      = { provider = "op", value = "flashcards/GITHUB_CLIENT_ID" }
GITHUB_CLIENT_SECRET  = { provider = "op", value = "flashcards/GITHUB_CLIENT_SECRET" }
OAUTH_TRANSACTION_KEY = { provider = "op", value = "flashcards/OAUTH_TRANSACTION_KEY" }
TYPESAFE_API_KEY      = { provider = "op", value = "flashcards/TYPESAFE_API_KEY" }
CLOUDFLARE_ACCOUNT_ID = { provider = "op", value = "flashcards/CLOUDFLARE_ACCOUNT_ID" }
CLOUDFLARE_API_TOKEN  = { provider = "op", value = "flashcards/CLOUDFLARE_API_TOKEN" }

[profiles.prod.secrets]
GITHUB_CLIENT_ID      = { provider = "op", value = "flashcards-prod/GITHUB_CLIENT_ID" }
GITHUB_CLIENT_SECRET  = { provider = "op", value = "flashcards-prod/GITHUB_CLIENT_SECRET" }
OAUTH_TRANSACTION_KEY = { provider = "op", value = "flashcards-prod/OAUTH_TRANSACTION_KEY" }

[daemon]
enabled = true
idle_timeout = "12h"
